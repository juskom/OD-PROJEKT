version: '3.9'

services:
  app:
    build:
      context: . # Ścieżka do katalogu z Dockerfile dla aplikacji Flask
      dockerfile: Dockerfile
    #command:
    expose:
      - "5000"
    ports:
      - "5000:5000" # Mapowanie portów dla aplikacji Flask
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app
    env_file:
      - .env
    restart: always

  nginx:
    build:
      context: ./nginx # Ścieżka do katalogu z Dockerfile dla Nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"   # HTTP
      - "443:443" # HTTPS
    depends_on:
      - app

    volumes:
      - ./nginx/ssl:/etc/nginx/ssl  # Montowanie certyfikatów SSL
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  # Montowanie konfiguracji Nginx
    restart: always
