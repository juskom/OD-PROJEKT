{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h1>Login</h1>
<form action="{{ url_for('auth.login_post') }}" method="POST">
    <label for="login">Login</label>
    <input type="text" id="login" name="login" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <label for="token">Kod TOTP:</label>
    <input type="text" id="token" name="token" required>
    <button type="submit">Login</button>
</form>
<p>Nie masz jeszcze konta? <a href="{{ url_for('auth.register') }}">Register</a></p>
<p>Zapomniałeś hasła? <a href="{{ url_for('auth.reset_password_request') }}">Reset Password</a></p>
{% endblock %}
