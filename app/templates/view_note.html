{% extends "base.html" %}

{% block content %}
<div class="note-container">
    <h1>{{ note.title }}</h1>  <!-- Wyświetlanie tytułu notatki -->

    <div class="note-metadata">
        <p><strong>Status:</strong>
            {% if note.is_public %}
                Publiczna
            {% elif note.is_shared %}
                Udostępniona
            {% else %}
                Prywatna
            {% endif %}
        </p>
    </div>

    <hr>

    {% if note.is_encrypted %}
        <div class="note-decryption">
            <form method="POST" action="{{ url_for('main.view_note', note_id=note.id) }}">
                <label for="encryption_key">Klucz odszyfrowania:</label>
                <input type="text" name="encryption_key" id="encryption_key" placeholder="Wpisz klucz odszyfrowania" required>
                <button type="submit">Odszyfruj</button>
            </form>
        </div>
    {% else %}
        <div class="note-content">
            <!-- Renderowanie treści notatki jako HTML -->
            {{ rendered_content | safe }}
        </div>
    {% endif %}

    <div class="note-actions">
        <a href="{{ url_for('main.my_notes') }}">Powrót do listy notatek</a>
    </div>
</div>
{% endblock %}
