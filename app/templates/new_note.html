{% extends "base.html" %}

{% block content %}
<h1>Dodaj nową notatkę</h1>

<form action="{{ url_for('main.new_note_post') }}" method="post">
    <div>
        <label for="title">Tytuł:</label>
        <input type="text" id="title" name="title" placeholder="Wpisz tytuł notatki" required>
    </div>

    <div>
        <label for="text">Treść notatki:</label>
        <textarea id="text" name="text" rows="20" cols="100" placeholder="Wpisz treść notatki" required></textarea>
    </div>

    <div>
        <label for="is_public">Czy notatka ma być publiczna?</label>
        <input type="checkbox" id="is_public" name="is_public">
    </div>

    <div>
        <label for="is_encrypted">Czy notatka ma być szyfrowana?</label>
        <input type="checkbox" id="is_encrypted" name="is_encrypted" onchange="toggleEncryptionKey(this)">
        <div id="encryption-key-field" style="display: none;">
            <label for="encryption_key">Klucz szyfrowania:</label>
            <input type="password" id="encryption_key" name="encryption_key" placeholder="Wpisz klucz szyfrowania">
        </div>
    </div>

    <div>
        <label for="is_shared">Czy notatka ma być udostępniona innym użytkownikom?</label>
        <input type="checkbox" id="is_shared" name="is_shared" onchange="toggleSharedWith(this)">
        <div id="shared-with-field" style="display: none;">
            <label for="shared_with">Udostępnij użytkownikom (loginy oddzielone spacjami):</label>
            <input type="text" id="shared_with" name="shared_with" placeholder="np. user1 user2 user3">
        </div>
    </div>

    <div>
        <button type="submit">Dodaj notatkę</button>
    </div>
</form>

<script>
    function toggleEncryptionKey(checkbox) {
        const keyField = document.getElementById('encryption-key-field');
        if (checkbox.checked) {
            keyField.style.display = 'block';
        } else {
            keyField.style.display = 'none';
            document.getElementById('encryption_key').value = '';
        }
    }

    function toggleSharedWith(checkbox) {
        const sharedWithField = document.getElementById('shared-with-field');
        if (checkbox.checked) {
            sharedWithField.style.display = 'block';
        } else {
            sharedWithField.style.display = 'none';
            document.getElementById('shared_with').value = '';
        }
    }
</script>
{% endblock %}
